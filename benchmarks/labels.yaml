# Benchmark ground truth.
#
# ⚠ PARTIALLY VERIFIED. Read which half before trusting a number.
#
# `approx_center` — STILL UNVERIFIED. Every one is an approximate district centre
# taken from general reference, not a surveyed position. It is used only to decide
# which run belongs to which AOI, so an error of a kilometre is tolerable there and
# fatal nowhere. The global `verified` flag below refers to these and stays false
# until Matthew checks them.
#
# `known_workings` — VERIFIED for 8 of 11 AOIs, as of 2026-08-13. Derived
# programmatically from data/reference/wa_occurrences.geojson (WA DNR / WGS Mines &
# Minerals) and filtered to survey- and topo-grade positions only; district_centroid,
# variable and derived positions are excluded. That filtering *is* the check the
# original header asked for. Per-AOI `workings_verified` gates the working-percentile
# and recall@high metrics — not the global flag — because those metrics read working
# coordinates, not AOI centres. See the status block below and `workings_provenance`
# at the foot of the file.
#
# Labels:
#   positive  documented workings, production, or assayed occurrences
#   control   plausible-looking ground, prospected historically, no documented
#             occurrence. Hardest to source and the most diagnostic — a model
#             that scores every batholith contact margin high passes on
#             positives alone.
#   null      ground that should obviously score low. Catches the failure mode
#             where everything comes out at 0.7.
#
# `toponym_revealing: true` marks an AOI whose positives are legible from the
# place names themselves. Those are excluded from the primary metrics — see
# §23 and the --disable-toponyms discussion in the benchmark report.

