# Benchmark ground truth.
#
# ⚠ DRAFT — NOT YET USABLE AS GROUND TRUTH.
#
# Every coordinate below is an approximate district centre taken from general
# reference, not a surveyed position, and no `known_workings` entry has been
# verified. Until Matthew checks these against WA DNR MRDS /
# `Gold_Silver_Locations` and the historical literature in
# docs/intake_analyses/, `scripts/benchmark.py` will refuse to report
# working-percentile or recall metrics and will say why.
#
# Labels:
#   positive  documented workings, production, or assayed occurrences
#   control   plausible-looking ground, prospected historically, no documented
#             occurrence. Hardest to source and the most diagnostic — a model
#             that scores every batholith contact margin high passes on
#             positives alone.
#   null      ground that should obviously score low. Catches the failure mode
#             where everything comes out at 0.7.
#
# `toponym_revealing: true` marks an AOI whose positives are legible from the
# place names themselves. Those are excluded from the primary metrics — see
# §23 and the --disable-toponyms discussion in the benchmark report.

version: "2026-08-01-draft"
verified: false          # ← Matthew sets this to true after checking coordinates

aois:
  # --- Positives ---------------------------------------------------------
  monte_cristo:
    label: positive
    county: Snohomish
    approx_center: [-121.44, 48.03]
    toponym_revealing: true      # the district is literally named "Monte Cristo"
    notes: >
      Named in knowledge/historical/gold.md; significant historical production.
      Toponym-revealing, so excluded from the headline metric.
    known_workings: []           # TODO(Matthew): Pride of the Mountains, Mystery, etc.
